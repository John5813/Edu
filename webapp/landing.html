<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{META_DESC}}">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="icon" href="/static/logo.jpg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Edufayl">
<meta property="og:locale" content="uz_UZ">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{META_DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<link rel="stylesheet" href="/shop/style.css">
<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>

<header>
  <div class="wrap head-in">
    <a class="logo" href="/" aria-label="Edufayl"><img src="/static/logo.jpg" alt="Edufayl" width="44" height="44"></a>
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <form action="/shop" method="get" role="search">
        <input name="q" type="search" placeholder="Tayyor mavzular ichidan qidiring..." autocomplete="off" aria-label="Tayyor mavzular ichidan qidirish">
      </form>
    </div>
    <a class="create" href="{{CREATE}}">+ Yaratish</a>
  </div>
</header>

<main class="wrap landing">
  <nav class="crumbs"><a href="/">Edufayl</a> / {{H1}}</nav>
  <section class="hero-l">
    <h1>{{H1}}</h1>
    <p class="lead">{{LEAD}}</p>
    <div class="cta-row">
      <a class="buy" href="{{CREATE}}">Hoziroq yaratish</a>
      <a class="ghost" href="__BOT_URL__" target="_blank" rel="noopener">Telegram botda</a>
    </div>
  </section>

  <section class="about">
    <h2>Qanday ishlaydi</h2>
    <ol class="steps">{{STEPS}}</ol>
  </section>

  <section class="about">
    <h2>Nimalar kiradi</h2>
    <ul class="outline">{{INCLUDES}}</ul>
  </section>

  {{READY}}

  <section class="about faq">
    <h2>Ko'p beriladigan savollar</h2>
    {{FAQ}}
  </section>

  <section class="about">
    <h2>Boshqa xizmatlar</h2>
    <p class="others">{{OTHERS}} · <a href="/shop">Tayyor mavzular</a></p>
  </section>
</main>

<footer class="wrap">Edufayl — edufayl.org · Telegram: <a href="__BOT_URL__" target="_blank" rel="noopener">bot</a></footer>
<script>
  // Bot nomi hali ma'lum bo'lmasa (bot ishga tushmoqda) — havola yashiriladi.
  document.querySelectorAll('a[href^="__"]').forEach(a => { a.hidden = true; });
</script>
</body>
</html>
