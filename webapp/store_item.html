<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} — tayyor taqdimot</title>
<meta name="description" content="{{META_DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="product">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{META_DESC}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/shop/style.css">
<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>

<header>
  <div class="wrap head-in">
    <a class="logo" href="/shop">Tayyor<span>Ish</span></a>
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <form action="/shop" method="get">
        <input name="q" type="search" placeholder="Mavzu bo'yicha qidiring..." autocomplete="off">
      </form>
    </div>
    {{CREATE_TOP}}
  </div>
</header>

<main class="wrap">
  <nav class="crumbs">{{CRUMBS}}</nav>

  <div class="item-head">
    {{KIND}}
    <h1>{{TITLE}}</h1>
    {{DESC_BLOCK}}
    <div class="facts">{{FACTS}}</div>
  </div>

  <div class="buy-bar">
    <div class="buy-price">{{PRICE}}</div>
    {{BUY}}
  </div>
  <p class="note">{{NOTE}}</p>

  <div class="slides">{{SLIDES}}</div>
</main>

<footer class="wrap">Har bir ish mijoz ma'lumotlaridan tozalangan holda joylanadi.</footer>

</body>
</html>
