<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{META_DESC}}">
<meta name="robots" content="{{ROBOTS}},max-image-preview:large">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Edufayl">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{META_DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<script type="application/ld+json">{{JSONLD}}</script>
<link rel="stylesheet" href="/shop/style.css">
</head>
<body>

<header>
  <div class="wrap head-in">
    <a class="logo" href="/" aria-label="Edufayl"><img src="/static/logo.jpg" alt="Edufayl" width="44" height="44"></a>
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <form action="" method="get" role="search"><input id="q" name="q" type="search" value="{{Q}}" placeholder="Mavzu bo'yicha qidiring..." autocomplete="off" aria-label="Mavzu bo'yicha qidirish"></form>
    </div>
    <a class="create" id="create-top" href="__BOT_URL__" target="_blank" rel="noopener">+ Yangi yaratish</a>
  </div>
</header>

<main class="wrap">
  {{CRUMBS}}
  <div class="cat-head">
    <h1>{{H1}}</h1>
    <p class="cat-intro">{{INTRO}}</p>
  </div>
  <nav class="kinds" id="kinds" aria-label="Ish turlari">{{KINDS}}</nav>
  <div class="filters">
    <nav class="chips" id="cats" aria-label="Fanlar">{{CATS}}</nav>
    <select id="sort" aria-label="Saralash">
      <option value="new">Yangi qo'shilgan</option>
      <option value="popular">Ommabop</option>
      <option value="cheap">Arzon avval</option>
      <option value="expensive">Qimmat avval</option>
    </select>
  </div>
  <div id="notice">{{NOTICE}}</div>
  <div class="count" id="count">{{COUNT}}</div>
  <div class="grid" id="grid">{{GRID}}</div>
  <button class="more" id="more" {{MORE_HIDDEN}}>Yana ko'rsatish</button>
  {{PAGER}}
</main>

<footer class="wrap">Har bir ish mijoz ma'lumotlaridan tozalangan holda joylanadi.</footer>

<script type="application/json" id="init">{{INIT}}</script>
<script>
const $ = s => document.querySelector(s);
const money = n => (n || 0).toLocaleString('ru-RU').replace(/ /g, ' ') + " so'm";
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Bot nomi serverda HTML ichiga qo'yiladi. Hali ma'lum bo'lmasa —
   havola o'rnida o'rin egallovchi qoladi va tugma ko'rsatilmaydi. */
const BOT_URL = $('#create-top').getAttribute('href');
const HAS_BOT = BOT_URL && !BOT_URL.startsWith('__');
$('#create-top').hidden = !HAS_BOT;

/* Taqdimotda slayd, Word hujjatida varaq sanaladi. */
const sheets = it => it.file_type === 'docx' ? 'varaq' : 'slayd';

const createBtn = label => HAS_BOT
  ? `<a class="create" href="${esc(BOT_URL)}" target="_blank" rel="noopener">${label}</a>`
  : '';

/* Birinchi sahifa serverda chizilgan (qidiruv tizimlari ro'yxatni JavaScriptsiz ko'rsin).
   Tur va fan — oddiy havolalar (har biri o'z sahifasi); bu yerda faqat qidiruv, saralash va
   «Yana ko'rsatish» ishlaydi. */
const init = JSON.parse($('#init').textContent || '{}');
const state = {
  q: init.q || '', category: init.category || '', type: init.type || '',
  sort: init.sort || 'new', page: init.page || 1,
  total: init.total || 0, loaded: init.loaded || 0, base: init.base || '/shop',
};
$('#sort').value = state.sort;

function syncUrl() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.sort !== 'new') p.set('sort', state.sort);
  const qs = p.toString();
  history.replaceState({}, '', state.base + (qs ? '?' + qs : ''));
}

/* ── Katalog ─────────────────────────────── */
async function load(reset) {
  if (reset) { state.page = 1; state.loaded = 0; $('#grid').innerHTML = skeletons(8); }
  const p = new URLSearchParams({ sort: state.sort, page: state.page });
  if (state.q) p.set('q', state.q);
  if (state.type) p.set('type', state.type);
  if (state.category) p.set('category', state.category);

  let data;
  try {
    const r = await fetch('/api/shop/items?' + p);
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    $('#grid').innerHTML = '';
    $('#notice').innerHTML = '';
    $('#count').innerHTML = '<div class="state"><b>Ro\'yxat yuklanmadi</b>Internet aloqasini tekshirib, sahifani yangilang.</div>';
    $('#more').hidden = true;
    return;
  }

  state.total = data.total;
  state.loaded += data.items.length;
  if (reset) { $('#grid').innerHTML = ''; $('#notice').innerHTML = ''; }

  if (!data.total) {
    $('#count').textContent = '';
    $('#grid').innerHTML = state.q || state.category
      ? `<div class="state" style="grid-column:1/-1"><b>Hech narsa topilmadi</b>
         Bu mavzu katalogda yo'q — uni hoziroq yaratib olsangiz bo'ladi.
         ${createBtn("+ Shu mavzuni yaratish")}</div>`
      : `<div class="state" style="grid-column:1/-1"><b>Katalog hozircha bo'sh</b>
         Tez orada tayyor ishlar qo'shiladi.${createBtn("+ Yangi yaratish")}</div>`;
    $('#more').hidden = true;
    return;
  }

  if (reset && data.fuzzy) {
    // Aynan so'ralgani yo'q — nima ko'rsatilayotgani aytilmasa chalg'itadi.
    $('#notice').innerHTML = `<div class="notice">
      <span><b>«${esc(state.q)}»</b> aynan topilmadi — shunga yaqin mavzular:</span>
      ${createBtn("+ Shu mavzuni yaratish")}</div>`;
  }

  $('#count').textContent = data.total + ' ta ish topildi';
  $('#grid').insertAdjacentHTML('beforeend', data.items.map(card).join(''));
  $('#more').hidden = state.loaded >= state.total;
}

const skeletons = n => '<div class="skel"></div>'.repeat(n);

/* Kartochka — haqiqiy havola: qidiruv tizimlari indekslay olsin va
   yangi oynada ochish ishlasin. */
function card(it) {
  return `<a class="card" href="${esc(it.url)}">
    <img class="thumb" src="${esc(it.preview)}" alt="${esc(it.title)}${it.work_label ? ' — ' + esc(it.work_label.toLowerCase()) : ''}" loading="lazy" width="480" height="270">
    <div class="card-b">
      ${it.work_label ? `<div class="card-kind">${esc(it.work_label)}</div>` : ''}
      <div class="card-t">${esc(it.title)}</div>
      <div class="card-m">
        ${it.slide_count ? `<span class="tag">${it.slide_count} ${sheets(it)}</span>` : ''}
        ${it.category ? `<span class="tag">${esc(it.category)}</span>` : ''}
      </div>
      <div class="price">${money(it.price)}</div>
    </div>
  </a>`;
}

/* Tanlangan tugma yonga suriladigan qatorning ko'rinmas qismida qolmasin. */
function showActive(row) {
  const on = row && row.querySelector('.on');
  if (!on || on === row.firstElementChild) return;
  row.scrollLeft = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
}
showActive($('#kinds'));
showActive($('#cats'));

/* ── Hodisalar ───────────────────────────── */
const pager = () => { const p = $('#pager'); if (p) p.hidden = true; };
let timer;
$('#q').closest('form').onsubmit = e => e.preventDefault();
$('#q').oninput = e => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    state.q = e.target.value.trim();
    syncUrl();
    pager();
    load(true);
  }, 280);
};
$('#sort').onchange = e => { state.sort = e.target.value; syncUrl(); pager(); load(true); };
$('#more').onclick = () => { state.page++; pager(); load(false); };
</script>
</body>
</html>
