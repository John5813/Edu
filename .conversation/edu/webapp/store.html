<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tayyor taqdimotlar va ishlar — do'kon</title>
<meta name="description" content="Tayyor taqdimot va ishlar to'plami: fan bo'yicha tanlang, barcha slaydlarni ko'ring va darhol yuklab oling. Mavzu topilmasa, yangisini buyurtma qiling.">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="Tayyor taqdimotlar va ishlar">
<meta property="og:description" content="Fan bo'yicha tayyor ishlar: barcha slaydlarni ko'rib, darhol yuklab oling.">
<meta property="og:url" content="{{CANONICAL}}">
<link rel="stylesheet" href="/shop/style.css">
</head>
<body>

<header>
  <div class="wrap head-in">
    <a class="logo" href="/shop">Tayyor<span>Ish</span></a>
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="q" type="search" placeholder="Mavzu bo'yicha qidiring..." autocomplete="off">
    </div>
    <a class="create" id="create-top" href="__BOT_URL__" target="_blank" rel="noopener">+ Yangi yaratish</a>
  </div>
</header>

<main class="wrap">
  <nav class="kinds" id="kinds"></nav>
  <div class="filters">
    <div class="chips" id="cats"></div>
    <select id="sort" aria-label="Saralash">
      <option value="new">Yangi qo'shilgan</option>
      <option value="popular">Ommabop</option>
      <option value="cheap">Arzon avval</option>
      <option value="expensive">Qimmat avval</option>
    </select>
  </div>
  <div id="notice"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Yana ko'rsatish</button>
</main>

<footer class="wrap">Har bir ish mijoz ma'lumotlaridan tozalangan holda joylanadi.</footer>

<script>
const $ = s => document.querySelector(s);
const money = n => (n || 0).toLocaleString('ru-RU').replace(/ /g, ' ') + " so'm";
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Bot nomi serverda HTML ichiga qo'yiladi. Hali ma'lum bo'lmasa —
   havola o'rnida o'rin egallovchi qoladi va tugma ko'rsatilmaydi. */
const BOT_URL = $('#create-top').getAttribute('href');
const HAS_BOT = BOT_URL && !BOT_URL.startsWith('__');
$('#create-top').hidden = !HAS_BOT;

/* Taqdimotda slayd, Word hujjatida varaq sanaladi. */
const sheets = it => it.file_type === 'docx' ? 'varaq' : 'slayd';

const createBtn = label => HAS_BOT
  ? `<a class="create" href="${esc(BOT_URL)}" target="_blank" rel="noopener">${label}</a>`
  : '';

/* Havoladan boshlang'ich holat — /shop?q=...&category=... ulashsa bo'ladi. */
const startup = new URLSearchParams(location.search);
const state = {
  q: startup.get('q') || '',
  category: startup.get('category') || '',
  type: startup.get('type') || '',
  sort: startup.get('sort') || 'new',
  page: 1, total: 0, loaded: 0,
};
$('#q').value = state.q;
$('#sort').value = state.sort;

function syncUrl() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.type) p.set('type', state.type);
  if (state.category) p.set('category', state.category);
  if (state.sort !== 'new') p.set('sort', state.sort);
  const qs = p.toString();
  history.replaceState({}, '', '/shop' + (qs ? '?' + qs : ''));
}

/* ── Katalog ─────────────────────────────── */
async function load(reset) {
  if (reset) { state.page = 1; state.loaded = 0; $('#grid').innerHTML = skeletons(8); }
  const p = new URLSearchParams({ sort: state.sort, page: state.page });
  if (state.q) p.set('q', state.q);
  if (state.type) p.set('type', state.type);
  if (state.category) p.set('category', state.category);

  let data;
  try {
    const r = await fetch('/api/shop/items?' + p);
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    $('#grid').innerHTML = '';
    $('#notice').innerHTML = '';
    $('#count').innerHTML = '<div class="state"><b>Ro\'yxat yuklanmadi</b>Internet aloqasini tekshirib, sahifani yangilang.</div>';
    $('#more').hidden = true;
    return;
  }

  state.total = data.total;
  state.loaded += data.items.length;
  if (reset) { $('#grid').innerHTML = ''; $('#notice').innerHTML = ''; }

  if (!data.total) {
    $('#count').textContent = '';
    $('#grid').innerHTML = state.q || state.category
      ? `<div class="state" style="grid-column:1/-1"><b>Hech narsa topilmadi</b>
         Bu mavzu katalogda yo'q — uni hoziroq yaratib olsangiz bo'ladi.
         ${createBtn("+ Shu mavzuni yaratish")}</div>`
      : `<div class="state" style="grid-column:1/-1"><b>Katalog hozircha bo'sh</b>
         Tez orada tayyor ishlar qo'shiladi.${createBtn("+ Yangi yaratish")}</div>`;
    $('#more').hidden = true;
    return;
  }

  if (reset && data.fuzzy) {
    // Aynan so'ralgani yo'q — nima ko'rsatilayotgani aytilmasa chalg'itadi.
    $('#notice').innerHTML = `<div class="notice">
      <span><b>«${esc(state.q)}»</b> aynan topilmadi — shunga yaqin mavzular:</span>
      ${createBtn("+ Shu mavzuni yaratish")}</div>`;
  }

  $('#count').textContent = data.total + ' ta ish topildi';
  $('#grid').insertAdjacentHTML('beforeend', data.items.map(card).join(''));
  $('#more').hidden = state.loaded >= state.total;
}

const skeletons = n => '<div class="skel"></div>'.repeat(n);

/* Kartochka — haqiqiy havola: qidiruv tizimlari indekslay olsin va
   yangi oynada ochish ishlasin. */
function card(it) {
  return `<a class="card" href="/shop/${esc(it.code)}">
    <img class="thumb" src="${esc(it.preview)}" alt="${esc(it.title)}" loading="lazy">
    <div class="card-b">
      ${it.work_label ? `<div class="card-kind">${esc(it.work_label)}</div>` : ''}
      <div class="card-t">${esc(it.title)}</div>
      <div class="card-m">
        ${it.slide_count ? `<span class="tag">${it.slide_count} ${sheets(it)}</span>` : ''}
        ${it.category ? `<span class="tag">${esc(it.category)}</span>` : ''}
      </div>
      <div class="price">${money(it.price)}</div>
    </div>
  </a>`;
}

/* ── Ish turlari: katalogning asosiy bo'linishi ─ */
async function loadKinds() {
  let kinds = [];
  try {
    const r = await fetch('/api/shop/types');
    if (r.ok) kinds = (await r.json()).types || [];
  } catch (e) { /* turlarsiz ham ishlayveradi */ }

  if (!kinds.length) { $('#kinds').innerHTML = ''; return; }
  const on = k => k === state.type ? ' on' : '';
  $('#kinds').innerHTML =
    `<a class="kind-tab${on('')}" href="/shop" data-k="">Hammasi</a>` +
    kinds.map(k => `<a class="kind-tab${on(k.key)}" data-k="${esc(k.key)}"
        href="/shop?type=${encodeURIComponent(k.key)}">${esc(k.label)} <i>${k.count}</i></a>`).join('');
}

/* ── Fanlar ──────────────────────────────── */
async function loadCats() {
  let cats = [];
  try {
    // Tanlangan tur ichidagi fanlar — bo'sh bo'lim ko'rsatilmasin
    const url = '/api/shop/categories' + (state.type ? '?type=' + encodeURIComponent(state.type) : '');
    const r = await fetch(url);
    if (r.ok) cats = (await r.json()).categories || [];
  } catch (e) { /* fansiz ham ishlayveradi */ }

  const on = c => c === state.category ? ' on' : '';
  $('#cats').innerHTML =
    `<a class="chip${on('')}" href="/shop" data-c="">Hammasi</a>` +
    cats.map(c => `<a class="chip${on(c.name)}" href="/shop?category=${encodeURIComponent(c.name)}"
        data-c="${esc(c.name)}">${esc(c.name)} (${c.count})</a>`).join('');
}

/* ── Hodisalar ───────────────────────────── */
let timer;
$('#q').oninput = e => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    state.q = e.target.value.trim();
    syncUrl();
    load(true);
  }, 280);
};
$('#sort').onchange = e => { state.sort = e.target.value; syncUrl(); load(true); };
$('#cats').onclick = e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  e.preventDefault();
  state.category = chip.dataset.c;
  $('#cats').querySelectorAll('.chip').forEach(n => n.classList.toggle('on', n === chip));
  syncUrl();
  load(true);
};
$('#kinds').onclick = e => {
  const tab = e.target.closest('.kind-tab');
  if (!tab) return;
  e.preventDefault();
  state.type = tab.dataset.k;
  $('#kinds').querySelectorAll('.kind-tab').forEach(n => n.classList.toggle('on', n === tab));
  syncUrl();
  // Tur o'zgarganda fanlar ro'yxati ham o'zgaradi
  loadCats();
  load(true);
};
$('#more').onclick = () => { state.page++; load(false); };

loadKinds();
loadCats();
load(true);
</script>
</body>
</html>
